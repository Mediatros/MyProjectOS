# CI MyProjectOS : lint des scripts + tests de fumée de bout en bout.
# Filet de sécurité avant toute publication : création, greffe, mise à jour, dogfooding.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Lint shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (POSIX sh, niveau warning)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck -s sh -S warning install.sh scripts/*.sh scripts/hooks/*.sh scripts/tests/*.sh

  smoke:
    name: Tests de fumée
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Création Core seul, check sans bloquant
        run: |
          sh scripts/init-project.sh /tmp/p-core
          sh scripts/check-project.sh /tmp/p-core

      - name: Création Hybrid + Knowledge, check sans bloquant
        run: |
          sh scripts/init-project.sh /tmp/p-full --life --code --knowledge
          sh scripts/check-project.sh /tmp/p-full
          test -f /tmp/p-full/SUJETS.md
          test -f /tmp/p-full/.myprojectos/manifest
          test -f /tmp/p-full/98_configuration/skills/my-project-os/SKILL.md
          test -L /tmp/p-full/.claude/skills/my-project-os
          test -L /tmp/p-full/.agents/skills/my-project-os
          test -f /tmp/p-full/97_gouvernance/README.md

      - name: Greffe idempotente (--into-existing ne casse rien)
        run: |
          echo "# personnalisation locale" >> /tmp/p-full/.claude/hooks/hook-pre-write.sh
          sh scripts/init-project.sh /tmp/p-full --life --code --knowledge --into-existing
          grep -q "personnalisation locale" /tmp/p-full/.claude/hooks/hook-pre-write.sh
          sh scripts/check-project.sh /tmp/p-full

      - name: Migration skill assistant (copie physique -> lien symbolique, T-PLAN-14 lot 2)
        run: |
          sh scripts/init-project.sh /tmp/p-migr --life
          # Simule un projet créé avant le lot 2 : copie physique, sans lien, manifest à l'ancien chemin.
          rm /tmp/p-migr/.claude/skills/my-project-os
          mkdir -p /tmp/p-migr/.claude/skills/my-project-os
          cp /tmp/p-migr/98_configuration/skills/my-project-os/SKILL.md /tmp/p-migr/.claude/skills/my-project-os/SKILL.md
          rm -rf /tmp/p-migr/98_configuration/skills/my-project-os
          sed 's#^98_configuration/skills/my-project-os/SKILL.md$#.claude/skills/my-project-os/SKILL.md#' \
            /tmp/p-migr/.myprojectos/manifest > /tmp/p-migr/.myprojectos/manifest.tmp \
            && mv /tmp/p-migr/.myprojectos/manifest.tmp /tmp/p-migr/.myprojectos/manifest
          sed 's/^version=.*/version=0.25.1/' /tmp/p-migr/.myprojectos/manifest > /tmp/p-migr/.myprojectos/manifest.tmp \
            && mv /tmp/p-migr/.myprojectos/manifest.tmp /tmp/p-migr/.myprojectos/manifest
          sed 's/^version_methode: .*/version_methode: 0.25.1/' /tmp/p-migr/PROJECT.md > /tmp/p-migr/PROJECT.md.tmp \
            && mv /tmp/p-migr/PROJECT.md.tmp /tmp/p-migr/PROJECT.md
          rm -rf /tmp/p-migr/97_gouvernance
          sh scripts/init-project.sh /tmp/p-migr --update-method
          # L'ancienne copie est sauvegardée, jamais laissée en dossier réel à côté du lien.
          test -f /tmp/p-migr/99_archive/methode-avant-v0.25.1/.claude/skills/my-project-os/SKILL.md
          test -L /tmp/p-migr/.claude/skills/my-project-os
          test -L /tmp/p-migr/.agents/skills/my-project-os
          test -f /tmp/p-migr/98_configuration/skills/my-project-os/SKILL.md
          test -f /tmp/p-migr/97_gouvernance/README.md
          sh scripts/check-project.sh /tmp/p-migr

      - name: Scénario de mise à jour (check-update + --update-method)
        run: |
          sh scripts/init-project.sh /tmp/p-old --life
          sed 's/^version_methode: .*/version_methode: 0.2.0/' /tmp/p-old/PROJECT.md > /tmp/p-old/PROJECT.md.tmp \
            && mv /tmp/p-old/PROJECT.md.tmp /tmp/p-old/PROJECT.md
          # Le manifest prime sur PROJECT.md pour la version de départ (Q9, T-PLAN-14) :
          # simuler un projet réellement ancien exige de patcher aussi son manifest.
          sed 's/^version=.*/version=0.2.0/' /tmp/p-old/.myprojectos/manifest > /tmp/p-old/.myprojectos/manifest.tmp \
            && mv /tmp/p-old/.myprojectos/manifest.tmp /tmp/p-old/.myprojectos/manifest
          # Détection : une mise à jour doit être signalée (code 10).
          rc=0
          MYPROJECTOS_REPO_URL="$GITHUB_WORKSPACE" sh /tmp/p-old/scripts/check-update.sh /tmp/p-old || rc=$?
          test "$rc" -eq 10
          # Le contenu utilisateur ne doit jamais être touché par la mise à jour.
          echo "contenu utilisateur" > /tmp/p-old/00_inbox/note.md
          # Artefact retiré de la méthode entre deux versions : la mise à jour doit
          # le sauvegarder puis le supprimer, jamais le laisser orphelin (M10).
          echo "artefact obsolete" > /tmp/p-old/scripts/artefact-obsolete.sh
          printf '%s\n' "scripts/artefact-obsolete.sh" >> /tmp/p-old/.myprojectos/manifest
          sh scripts/init-project.sh /tmp/p-old --update-method
          grep -q "contenu utilisateur" /tmp/p-old/00_inbox/note.md
          # Les anciens artefacts sont sauvegardés avant remplacement.
          test -f /tmp/p-old/99_archive/methode-avant-v0.2.0/scripts/check-project.sh
          test -f /tmp/p-old/99_archive/methode-avant-v0.2.0/scripts/artefact-obsolete.sh
          test ! -f /tmp/p-old/scripts/artefact-obsolete.sh
          # Après mise à jour : plus rien à signaler (code 0) et projet cohérent.
          MYPROJECTOS_REPO_URL="$GITHUB_WORKSPACE" sh /tmp/p-old/scripts/check-update.sh /tmp/p-old
          sh scripts/check-project.sh /tmp/p-old

      - name: Fusion des hooks sans python3, sortie non nulle explicite (I8)
        run: |
          sh scripts/init-project.sh /tmp/p-nopy --code
          printf '{}' > /tmp/p-nopy/.claude/settings.json
          mkdir -p /tmp/fakebin
          for c in sh cp mkdir chmod sed mv rm grep head basename dirname date tr awk cat ls find; do
            p=$(command -v "$c" 2>/dev/null) || continue
            case "$p" in /*) ln -sf "$p" "/tmp/fakebin/$c" ;; esac
          done
          rc=0
          PATH="/tmp/fakebin" sh scripts/init-project.sh /tmp/p-nopy --code --into-existing || rc=$?
          test "$rc" -eq 1

      - name: Le repo méthode respecte sa propre gouvernance (dogfooding)
        run: |
          # L'atelier est un projet MyProjectOS ; la vitrine publique n'en est pas un
          # (PROJECT.md, PROGRESS.md, TASKS.md restent privés, DEC-0048). Le dossier
          # privé .myprojectos/publish, jamais exporté, dit dans quel dépôt on tourne.
          if [ -d .myprojectos/publish ]; then
            sh scripts/check-project.sh .
          else
            echo "Export public (sans .myprojectos/publish) : dogfooding sans objet."
          fi

      - name: Garde-fou Git (matrice)
        run: sh scripts/tests/test-hook-pre-git.sh

      - name: Progrès par sujet (projection, sujet.sh, hook, contrôles)
        run: sh scripts/tests/test-progres-par-sujet.sh
